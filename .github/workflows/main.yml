name: 🚀 Build & Deploy (Next + Nest)

on:
  push:
    branches: [nestjs_backend]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------- FRONTEND ----------
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f .next/standalone/server.js

      - name: Pack frontend
        run: |
          mkdir -p artifacts
          tar -czf artifacts/frontend.tgz \
            -C frontend \
            .next/standalone \
            .next/static \
            package.json \
            next.config.mjs

      # ---------- BACKEND ----------
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Pack backend
        run: |
          tar -czf artifacts/backend.tgz \
            -C backend \
            dist \
            prisma \
            prisma.config.ts \
            package.json \
            package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: artifacts/*.tgz

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: artifacts

      - name: Upload bundles
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "artifacts/*.tgz"
          target: "/tmp/jwell_deploy"

      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            APP=/var/www/html/jwell_b2b
            mkdir -p $APP/{frontend,backend,backups}

            tar -xzf /tmp/jwell_deploy/frontend.tgz -C $APP/frontend
            tar -xzf /tmp/jwell_deploy/backend.tgz -C $APP/backend

            cd $APP/backend
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy || true

            pm2 delete jwell_backend || true
            PORT=4000 pm2 start dist/src/main.js --name jwell_backend

            cd $APP/frontend
            pm2 delete jwell_frontend || true
            PORT=3000 pm2 start node --name jwell_frontend -- .next/standalone/server.js

            pm2 save
