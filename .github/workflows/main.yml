name: 🚀 Build & Deploy (Next + Nest + Prisma)

on:
  push:
    branches:
      - nestjs_backend
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ---------- FRONTEND ----------
      - name: Build frontend (standalone)
        working-directory: frontend
        run: |
          set -e
          npm ci
          npm run build
          test -f .next/standalone/server.js
          test -d .next/static

      - name: Pack frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # include public only if it exists
          FRONT_FILES=(
            ".next/standalone"
            ".next/static"
            "package.json"
            "package-lock.json"
          )

          if [ -d "frontend/public" ]; then
            FRONT_FILES+=("public")
          fi

          tar -czf artifacts/frontend.tgz \
            -C frontend \
            "${FRONT_FILES[@]}"

          ls -lah artifacts/frontend.tgz

      # ---------- BACKEND ----------
      - name: Build backend
        working-directory: backend
        run: |
          set -e
          npm ci
          npx prisma generate
          npm run build

      - name: Pack backend artifact
        run: |
          set -e
          mkdir -p artifacts
          tar -czf artifacts/backend.tgz \
            -C backend \
            dist prisma prisma.config.ts package.json package-lock.json
          ls -lah artifacts/backend.tgz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundles
          path: artifacts/*.tgz

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundles
          path: artifacts

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "artifacts/*.tgz"
          target: "/tmp/jwell_deploy"

      - name: Deploy & migrate
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            export DATABASE_URL="${{ secrets.DATABASE_URL }}"

            APP="/var/www/html/jwell_b2b"
            FRONT="$APP/frontend"
            BACK="$APP/backend"

            mkdir -p "$FRONT" "$BACK"

            echo "=== Deploy frontend ==="
            rm -rf "$FRONT"/*
            tar -xzf /tmp/jwell_deploy/frontend.tgz -C "$FRONT"

            # Fix Next standalone static path
            mkdir -p "$FRONT/.next/standalone/.next"
            rm -rf "$FRONT/.next/standalone/.next/static"
            cp -R "$FRONT/.next/static" "$FRONT/.next/standalone/.next/static"

            echo "=== Deploy backend ==="
            rm -rf "$BACK"/*
            tar -xzf /tmp/jwell_deploy/backend.tgz -C "$BACK"

            cd "$BACK"
            npm ci --omit=dev
            npx prisma generate
            DATABASE_URL="$DATABASE_URL" npx prisma migrate deploy

            pm2 restart jwell_backend || pm2 start dist/src/main.js --name jwell_backend
            pm2 restart jwell_frontend || pm2 start node --name jwell_frontend -- "$FRONT/.next/standalone/server.js"
            pm2 save

            echo "=== Health checks ==="
            curl -sS -I http://127.0.0.1:3000/ >/dev/null && echo "✅ Next OK" || echo "❌ Next FAIL"
            curl -sS -I http://127.0.0.1:4000/api >/dev/null && echo "✅ Nest OK" || echo "❌ Nest FAIL"

            echo "✅ Deployment completed"
