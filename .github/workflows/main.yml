on:
  push:
    branches:
    - nestjs_backend
  workflow_dispatch:


name: 🚀 Build and Deploy website

jobs:
  build:
    name: 🏗 Build
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install & build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: 📋 Verify frontend build
        run: |
          if [ ! -d frontend/.next ]; then
            echo "::error::frontend/.next is missing. Build may have failed."
            exit 1
          fi
          echo "Frontend build ready"

      - name: 📦 Install & build backend
        working-directory: backend
        run: |
          npm install
          npx prisma generate
          npm run build

      - name: 📦 Archive frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: |
            frontend/.next
            frontend/package.json
            frontend/package-lock.json
            frontend/next.config.mjs

      - name: 📦 Archive backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            backend/prisma
            backend/prisma.config.ts

  deploy-hostinger-password:
    name: 🚀 Deploy to Hostinger (Password Auth)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/nestjs_backend'

    steps:
      - name: 📥 Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-app
          path: frontend-out

      - name: 📥 Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend-out

      - name: 📤 Upload frontend to temp on server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "frontend-out/**"
          target: "/tmp/jwell_b2b/jwell_b2b_frontend"

      - name: 📤 Upload backend to temp on server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "backend-out/**"
          target: "/tmp/jwell_b2b/jwell_b2b_backend"

      - name: 🚀 Deploy frontend & backend
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Deploy frontend (Next.js - npm start)
            FRONTEND_DIR="/var/www/html/jwell_b2b/jwell_b2b_frontend"
            sudo mkdir -p $FRONTEND_DIR
            sudo cp -r /tmp/jwell_b2b/jwell_b2b_frontend/* $FRONTEND_DIR/
            cd $FRONTEND_DIR
            sudo npm install --omit=dev
            sudo chown -R www-data:www-data $FRONTEND_DIR
            if command -v pm2 &> /dev/null; then
              pm2 restart jwell_b2b_frontend 2>/dev/null || pm2 start npm --name jwell_b2b_frontend -- start
            fi
            echo "✅ Frontend deployed (port 3000)"

            # Deploy backend (NestJS)
            BACKEND_DIR="/var/www/html/jwell_b2b/jwell_b2b_backend"
            sudo mkdir -p $BACKEND_DIR
            sudo cp -r /tmp/jwell_b2b/jwell_b2b_backend/* $BACKEND_DIR/
            cd $BACKEND_DIR
            sudo npm install --omit=dev
            sudo npx prisma generate
            sudo npx prisma migrate deploy 2>/dev/null || true
            sudo chown -R www-data:www-data $BACKEND_DIR
            # Restart backend (PM2 or systemd - adjust if you use a different process manager)
            if command -v pm2 &> /dev/null; then
              pm2 restart jwell_b2b_backend 2>/dev/null || pm2 start dist/main.js --name jwell_b2b_backend
            fi

            sudo a2enmod rewrite headers expires deflate proxy proxy_http
            sudo systemctl reload apache2
            echo "✅ Deployment completed (frontend + backend)"
