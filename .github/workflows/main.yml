name: 🌱 Prisma Seed (Manual Only)

on:
  push:
    branches:
      - nestjs_backend
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to run seed on PRODUCTION DB"
        required: true
        default: "NO"

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout
        uses: actions/checkout@v4

      - name: ✅ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend deps
        working-directory: backend
        run: npm ci

      - name: 🧬 Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: 🌱 Run seed
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run seed
