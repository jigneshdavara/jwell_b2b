name: 🚀 Build & Deploy (Next + Nest + Prisma)

on:
  push:
    branches:
      - nestjs_backend
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------- FRONTEND ----------
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Pack frontend
        run: |
          mkdir -p artifacts
          tar -czf artifacts/frontend.tgz \
            -C frontend \
            .next/standalone \
            .next/static \
            public \
            package.json

      # ---------- BACKEND ----------
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Pack backend
        run: |
          tar -czf artifacts/backend.tgz \
            -C backend \
            dist prisma prisma.config.ts package.json package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundles
          path: artifacts/*.tgz

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundles
          path: artifacts

      - name: Upload bundles
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "artifacts/*.tgz"
          target: "/tmp/jwell_deploy"

      - name: Deploy & migrate
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DATABASE_URL
          script: |
            set -e

            export DATABASE_URL="${{ secrets.DATABASE_URL }}"

            APP="/var/www/html/jwell_b2b"
            FRONT="$APP/frontend"
            BACK="$APP/backend"

            mkdir -p $FRONT $BACK

            echo "Deploy frontend"
            rm -rf $FRONT/*
            tar -xzf /tmp/jwell_deploy/frontend.tgz -C $FRONT

            mkdir -p $FRONT/.next/standalone/.next
            cp -R $FRONT/.next/static $FRONT/.next/standalone/.next/static

            echo "Deploy backend"
            rm -rf $BACK/*
            tar -xzf /tmp/jwell_deploy/backend.tgz -C $BACK

            cd $BACK
            npm ci --omit=dev
            npx prisma generate

            echo "Run Prisma migrate"
            DATABASE_URL="$DATABASE_URL" npx prisma migrate deploy

            pm2 restart jwell_backend || pm2 start dist/src/main.js --name jwell_backend
            pm2 restart jwell_frontend || pm2 start node --name jwell_frontend -- $FRONT/.next/standalone/server.js

            pm2 save
