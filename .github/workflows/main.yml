name: 🚀 Build & Deploy (Next + Nest)

on:
  push:
    branches:
      - nestjs_backend
  workflow_dispatch:

jobs:
  build:
    name: 🏗 Build
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ---------- FRONTEND ----------
      - name: 📦 Build frontend (Next standalone)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f .next/standalone/server.js
          test -d .next/static

      - name: 📦 Pack frontend artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/frontend.tgz \
            -C frontend \
            .next/standalone \
            .next/static \
            public \
            package.json \
            package-lock.json \
            next.config.* || true

      # ---------- BACKEND ----------
      - name: 📦 Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: 📦 Pack backend artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/backend.tgz \
            -C backend \
            dist \
            prisma \
            prisma.config.ts \
            package.json \
            package-lock.json

      - name: ⬆️ Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundles
          path: artifacts/*.tgz

  deploy:
    name: 🚀 Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundles
          path: artifacts

      - name: 📤 Upload bundles (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "artifacts/frontend.tgz,artifacts/backend.tgz"
          target: "/tmp/jwell_deploy"

      - name: 🚀 Deploy & restart (PM2 + Prisma)
        uses: appleboy/ssh-action@v0.1.7
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            APP=/var/www/html/jwell_b2b
            FRONT=$APP/frontend
            BACK=$APP/backend
            TS=$(date +%Y%m%d_%H%M%S)

            mkdir -p $APP/backups

            # Backup
            [ -d "$FRONT" ] && tar -czf $APP/backups/frontend_$TS.tgz -C $APP frontend || true
            [ -d "$BACK" ] && tar -czf $APP/backups/backend_$TS.tgz -C $APP backend || true

            # Deploy frontend
            rm -rf $FRONT
            mkdir -p $FRONT
            tar -xzf /tmp/jwell_deploy/artifacts/frontend.tgz -C $FRONT

            # Fix Next standalone static
            mkdir -p $FRONT/.next/standalone/.next
            rm -rf $FRONT/.next/standalone/.next/static
            cp -R $FRONT/.next/static $FRONT/.next/standalone/.next/static

            # Deploy backend
            rm -rf $BACK
            mkdir -p $BACK
            tar -xzf /tmp/jwell_deploy/artifacts/backend.tgz -C $BACK

            cd $BACK
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy

            # PM2
            pm2 delete jwell_frontend || true
            pm2 delete jwell_backend || true

            PORT=3000 pm2 start node --name jwell_frontend -- $FRONT/.next/standalone/server.js
            PORT=4000 pm2 start dist/src/main.js --name jwell_backend

            pm2 save

            echo "✅ Deployment successful"
