name: 🚀 Build & Deploy (Next + Nest + Prisma)

on:
  push:
    branches:
      - nestjs_backend
  workflow_dispatch:

jobs:
  build:
    name: 🏗 Build
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout
        uses: actions/checkout@v4

      - name: ✅ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ---------- FRONTEND ----------
      - name: 🏗 Build frontend (standalone)
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f .next/standalone/server.js
          test -d .next/static

      - name: 📦 Pack frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          FRONT_FILES=(
            ".next/standalone"
            ".next/static"
            "package.json"
            "package-lock.json"
          )

          # include public only if it exists
          if [ -d "frontend/public" ]; then
            FRONT_FILES+=("public")
          fi

          tar -czf artifacts/frontend.tgz -C frontend "${FRONT_FILES[@]}"
          ls -lah artifacts/frontend.tgz

      # ---------- BACKEND ----------
      - name: 🏗 Build backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx prisma generate
          npm run build

      - name: 📦 Pack backend artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -czf artifacts/backend.tgz \
            -C backend \
            dist prisma prisma.config.ts package.json package-lock.json
          ls -lah artifacts/backend.tgz

      - name: ⬆️ Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundles
          path: artifacts/*.tgz

  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundles
          path: artifacts

      - name: 📤 Upload bundles to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "artifacts/*.tgz"
          target: "/tmp/jwell_deploy"

      - name: 🚀 Deploy + Prisma migrate + PM2 restart (preserve .env)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            APP="/var/www/html/jwell_b2b"
            FRONT="$APP/frontend"
            BACK="$APP/backend"
            BKP="$APP/backups"
            TS="$(date +%Y%m%d_%H%M%S)"

            mkdir -p "$FRONT" "$BACK" "$BKP"

            echo "=== Backup current deployments ==="
            if [ -d "$FRONT" ] && [ "$(ls -A "$FRONT" 2>/dev/null || true)" != "" ]; then
              tar -czf "$BKP/frontend_$TS.tgz" -C "$APP" frontend || true
              echo "✅ Frontend backup: $BKP/frontend_$TS.tgz"
            fi
            if [ -d "$BACK" ] && [ "$(ls -A "$BACK" 2>/dev/null || true)" != "" ]; then
              tar -czf "$BKP/backend_$TS.tgz" -C "$APP" backend || true
              echo "✅ Backend backup: $BKP/backend_$TS.tgz"
            fi

            echo "=== Deploy frontend ==="
            rm -rf "$FRONT"/*
            tar -xzf /tmp/jwell_deploy/artifacts/frontend.tgz -C "$FRONT"

            echo "=== Fix Next standalone static path ==="
            mkdir -p "$FRONT/.next/standalone/.next"
            rm -rf "$FRONT/.next/standalone/.next/static"
            cp -R "$FRONT/.next/static" "$FRONT/.next/standalone/.next/static"

            echo "=== Deploy backend (preserve .env) ==="
            # preserve backend .env (must already exist on server)
            if [ -f "$BACK/.env" ]; then
              cp "$BACK/.env" /tmp/jwell_backend.env
            fi

            rm -rf "$BACK"/*
            tar -xzf /tmp/jwell_deploy/artifacts/backend.tgz -C "$BACK"

            # restore backend .env
            if [ -f /tmp/jwell_backend.env ]; then
              mv /tmp/jwell_backend.env "$BACK/.env"
              chmod 600 "$BACK/.env"
            fi

            echo "=== Install backend prod deps ==="
            cd "$BACK"
            npm ci --omit=dev
            npx prisma generate

            echo "=== Prisma migrate deploy (loads $BACK/.env) ==="
            if [ ! -f "$BACK/.env" ]; then
              echo "❌ ERROR: $BACK/.env not found. Create it ONCE on the server."
              exit 1
            fi

            set -a
            source "$BACK/.env"
            set +a

            echo "=== Prisma migrate deploy ==="
            npx prisma migrate deploy

            echo "=== PM2 start/restart ==="
            command -v pm2 >/dev/null 2>&1 || (echo "❌ pm2 not installed" && exit 1)

            # Frontend (must use PORT=3000; backend .env may set PORT=4000)
            FRONT_ENTRY="$FRONT/.next/standalone/server.js"
            if pm2 describe jwell_frontend >/dev/null 2>&1; then
              PORT=3000 pm2 restart jwell_frontend --update-env
            else
              cd "$FRONT"
              PORT=3000 pm2 start node --name jwell_frontend -- "$FRONT_ENTRY"
            fi

            # Backend (must use PORT=4000)
            if pm2 describe jwell_backend >/dev/null 2>&1; then
              PORT=4000 pm2 restart jwell_backend --update-env
            else
              cd "$BACK"
              PORT=4000 pm2 start dist/src/main.js --name jwell_backend
            fi

            pm2 save

            echo "=== Health checks (3 retries, 2s sleep) ==="

            check_with_restart () {
              local url="$1"
              local name="$2"
              local app="$3"
              local tries=3
              local sleep_s=2

              for i in $(seq 1 $tries); do
                if curl -sS -I "$url" >/dev/null; then
                  echo "✅ $name OK"
                  return 0
                fi

                echo "⏳ $name failed ($i/$tries)"

                if [ "$i" -eq "$tries" ]; then
                  echo "🔄 Restarting $app (last attempt)"
                  pm2 restart "$app" --update-env || true
                fi

                sleep "$sleep_s"
              done

              echo "❌ $name FAILED after $tries tries"
              pm2 logs "$app" --lines 100 --nostream || true
              return 1
            }

            check_with_restart "http://127.0.0.1:3000/" "Next" "jwell_frontend"
            check_with_restart "http://127.0.0.1:4000/api" "Nest" "jwell_backend"

            echo "✅ Deployment completed successfully"
